# name: The display title of your workflow visible in the GitHub Actions tab
name: CI Test Suite

# on: Specifies the trigger events that automatically start this workflow
on:
  push:
    branches: ["main"]
  # Trigger every time code is pushed directly to main
  pull_request:
    branches: ["main"]
# Trigger whenever a Pull Request targeting main is opened or updated

# jobs: A collection of automated tasks that run when the workflow is triggered
jobs:
  # validate-code: A custom identifier/name for this specific job
  validate-code:
    # runs-on: Specifies the virtual machine (runner) OS provided by GitHub to execute commands
    runs-on: ubuntu-latest

    # steps: The sequential list of tasks performed inside this job from top to bottom
    steps:
      # uses: Pulls a pre-built reusable Action from GitHub Marketplace
      # actions/checkout@v4 clones/downloads your repository files onto the runner machine
      - name: Checkout Code
        uses: actions/checkout@v5

      # run: Executes standard shell commands on the virtual machine runner
      - name: Validate HTML / Run Tests
        run: echo "Running automated checks on the pull request code..."
